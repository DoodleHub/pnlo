<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12161d" />
    <title>Pnlok · Profit & loss</title>
    <style>
      /* PWA start_url: paints instantly (precached by sw.js) while "/" waits on auth and data.
         Values mirror the tokens in app/globals.css. */
      :root {
        color-scheme: dark;
        --bg-canvas: #12161d;
        --text-primary: #f5f6fa;
        --text-muted: #8089a0;
        --accent: #c9c1fe;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font: 15px/22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { display: grid; justify-items: center; gap: 20px; }
      @media (prefers-reduced-motion: no-preference) {
        main { animation: enter 400ms ease-out both; }
      }
      @keyframes enter { from { opacity: 0; transform: scale(0.96); } }
      .logo { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
      .logo svg { width: 28px; height: 28px; }
      .spinner { width: 20px; height: 20px; color: var(--text-muted); }
      @media (prefers-reduced-motion: no-preference) {
        .spinner { animation: spin 1s linear infinite; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main role="status" aria-label="Loading Pnlok">
      <div class="logo">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path fill="var(--accent)" d="M14 2.5 26.5 26h-5.6L14 12.6 7.1 26H1.5Z" /></svg>
        Pnlok
      </div>
      <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" opacity="0.25" />
        <path d="M21 12a9 9 0 0 0-9-9" />
      </svg>
    </main>
    <script>
      // Hold the splash briefly so it reads as a deliberate launch screen rather than a flash,
      // then hand off; it stays visible until "/" has something to show.
      const MIN_SPLASH_MS = 900;
      setTimeout(() => location.replace("/"), MIN_SPLASH_MS);
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/" /></noscript>
  </body>
</html>
