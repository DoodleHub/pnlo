<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12161d" />
    <title>Offline · Pnlok</title>
    <style>
      /* Static fallback served by sw.js; values mirror the tokens in app/globals.css. */
      :root {
        color-scheme: dark;
        --bg-canvas: #12161d;
        --bg-raised: #272c3a;
        --border-subtle: #212632;
        --text-primary: #f5f6fa;
        --text-secondary: #a8b2c6;
        --accent: #c9c1fe;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font: 15px/22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      svg { width: 40px; height: 40px; }
      h1 { margin: 16px 0 4px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--text-secondary); }
      button {
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--bg-canvas);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 28 28" aria-hidden="true"><path fill="var(--accent)" d="M14 2.5 26.5 26h-5.6L14 12.6 7.1 26H1.5Z" /></svg>
      <h1>You're offline</h1>
      <p>Pnlok needs a connection to load your calendar.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
